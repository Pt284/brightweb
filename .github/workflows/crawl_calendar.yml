name: Crawl Calendar

on:
  schedule:
    # Full crawl: mỗi ngày lúc 3h sáng VN (20:00 UTC) — crawl đủ MONTHS_TO_CRAWL tháng
    - cron: "0 2 * * *"
    - cron: "0 4 * * *"
    - cron: "0 7 * * *"
    - cron: "0 10 * * *"
    # Watch mode DỰ PHÒNG: CF Worker (cron */5 0-16 * * * UTC = 07:00-23:55 VN,
    # xem worker.js/wrangler.toml) là hệ chính lấy m3u8. Dòng dưới đây chỉ chạy
    # mỗi 16 phút (mốc :02/:18/:34/:50, lệch mốc 5 phút của Worker) làm lưới an
    # toàn nếu Worker miss — không xoá, vẫn dùng _run_watch_mode() sẵn có.
    - cron: "2,18,34,50 0-16 * * *"

  # Chạy tay từ GitHub UI
  workflow_dispatch:
    inputs:
      mode:
        description: "Chế độ: full | watch"
        required: false
        default: "full"
      months:
        description: "Số tháng crawl (chỉ dùng khi mode=full)"
        required: false
        default: "6"

jobs:
  crawl:
    name: Crawl & Push to Firestore
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: crawl-calendar
      cancel-in-progress: false   # xếp hàng, không huỷ job đang chạy

    steps:
      # 1. Checkout repo
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Setup Python
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # 3. Cài dependencies Python
      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # 4. Debug cron schedule
      - name: Debug github.event.schedule
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: echo "github.event.schedule=$SCHEDULE"

      # 5. Chạy script crawl bằng Python thuần
      - name: Run crawl_calendar.py
        run: python crawl_calendar.py
        env:
          # Tài khoản (ẩn trong secrets)
          HM_USERNAME:             ${{ secrets.HM_USERNAME }}
          HM_PASSWORD:             ${{ secrets.HM_PASSWORD }}
          # URL (ẩn trong secrets, không có trong mã nguồn)
          HM_BASE_URL:             ${{ secrets.HM_BASE_URL }}
          HM_CAL_PATH:             ${{ secrets.HM_CAL_PATH }}
          HM_LOGIN_PATH:           ${{ secrets.HM_LOGIN_PATH }}
          HM_LOGOUT_V2_PATH:       ${{ secrets.HM_LOGOUT_V2_PATH }}
          HM_LOGOUT_FINAL_PATH:    ${{ secrets.HM_LOGOUT_FINAL_PATH }}
          # Firebase
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          FIRESTORE_PROJECT_ID:    ${{ secrets.FIRESTORE_PROJECT_ID }}
          # Tham số chạy
          # Tự chọn watch mode khi đúng cron watch-mode kích hoạt; còn lại (full crawl
          # hằng ngày, hoặc chạy tay) mặc định full — input thủ công luôn được ưu tiên.
          CRAWL_MODE:              ${{ github.event.inputs.mode || (github.event.schedule == '2,18,34,50 0-16 * * *' && 'watch') || 'full' }}
          MONTHS_TO_CRAWL:         ${{ github.event.inputs.months || '6' }}

      # 6. Gửi Web Push cho session mới có m3u8
      - name: Send push notifications for new links
        if: success()
        run: python tools/send_push.py
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          FIRESTORE_PROJECT_ID:    ${{ secrets.FIRESTORE_PROJECT_ID }}
          VAPID_PRIVATE_KEY:       ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT:           ${{ secrets.VAPID_SUBJECT }}
          SITE_URL:                ${{ secrets.SITE_URL }}