name: Debug Secrets

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest

    steps:
      - name: Print environment variables (Base64)
        env:
          HM_BASE_URL:             ${{ secrets.HM_BASE_URL }}
          HM_CAL_PATH:             ${{ secrets.HM_CAL_PATH }}
          HM_LOGIN_PATH:           ${{ secrets.HM_LOGIN_PATH }}
          HM_LOGOUT_V2_PATH:       ${{ secrets.HM_LOGOUT_V2_PATH }}
          HM_LOGOUT_FINAL_PATH:    ${{ secrets.HM_LOGOUT_FINAL_PATH }}
        run: |
          echo "HM_BASE_URL=$(echo -n "$HM_BASE_URL" | base64)"
          echo "HM_CAL_PATH=$(echo -n "$HM_CAL_PATH" | base64)"
          echo "HM_LOGIN_PATH=$(echo -n "$HM_LOGIN_PATH" | base64)"
          echo "HM_LOGOUT_V2_PATH=$(echo -n "$HM_LOGOUT_V2_PATH" | base64)"
          echo "HM_LOGOUT_FINAL_PATH=$(echo -n "$HM_LOGOUT_FINAL_PATH" | base64)"
