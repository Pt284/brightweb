<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self' https://cdn.jsdelivr.net https://www.gstatic.com https://apis.google.com https://www.youtube.com https://cdn.plyr.io;
  style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.plyr.io;
  font-src 'self' https://fonts.gstatic.com;
  img-src 'self' https://fonts.gstatic.com https://i.ytimg.com data:;
  connect-src 'self' https://*.firebaseio.com https://*.googleapis.com https://identitytoolkit.googleapis.com https://brightweb-sync.mcdg5444.workers.dev https://www.youtube.com https://noembed.com;
  frame-src https://www.youtube.com https://brightwebaccbase.firebaseapp.com;
  object-src 'none';
">
  <title>HM-LEAKBASE😈</title>
  <link rel="icon" href="https://fonts.gstatic.com/s/e/notoemoji/latest/1f608/512.gif" type="image/gif">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="glass.css">
  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css">
  <style>
    .video-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: var(--color-bg);
    }

    #custom-poster {
      position: absolute;
      inset: 0;
      z-index: 10;
      transition: opacity 0.3s;
      cursor: pointer;
      background: var(--color-bg);
    }

    #custom-poster img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    #poster-play-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: var(--color-red-alpha);
      border: none;
      color: var(--color-text-inverse);
      font-size: 28px;
      cursor: pointer;
      transition: transform 0.15s, background 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #poster-play-btn::before {
      content: '▶';
      margin-left: 5px;
    }

    #poster-play-btn:hover {
      background: var(--color-red);
      transform: translate(-50%, -50%) scale(1.1);
    }

    #player-toast {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.85);
      background: var(--color-surface-modal);
      color: var(--color-text-inverse);
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 17px;
      opacity: 0;
      pointer-events: none;
      z-index: 20;
      transition: opacity 0.15s, transform 0.15s;
    }

    #player-toast.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    #custom-video-title {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      z-index: 15;
      color: var(--color-text-inverse);
      font-size: 1.15rem;
      font-weight: 600;
      text-shadow: 0 1px 4px var(--color-surface-input);
      pointer-events: none;
    }

    .plyr__video-wrapper::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 1;
      cursor: pointer;
    }

    .plyr iframe {
      pointer-events: none !important;
    }

    /* Phase 2: Drag & Drop + Edit Mode */
    .course-card.dragging {
      opacity: .35;
      transition: opacity .15s;
    }

    .course-card.drag-over {
      outline: 2px dashed var(--color-accent);
      box-shadow: var(--shadow-glass-hover);
    }

    body.edit-mode .course-card {
      cursor: grab;
    }
    
    .tree-node.dragging { opacity: 0.5; }
    .tree-node.drag-over-tree { border-top: 2px dashed var(--color-accent); margin-top:-2px; }
    .tree-node.is-cut > .tree-label { opacity: 0.35; border: 1px dashed var(--color-accent) !important; padding: 4px; border-radius: 6px; }
    .tree-node.is-hidden > .tree-label { opacity: 0.45; filter: grayscale(80%); }

    .course-card.is-hidden-course {
      opacity: .4;
    }

    .hidden-badge {
      font-size: .7rem;
      color: var(--color-text-muted);
      border: 1px solid var(--color-border);
      padding: 2px 8px;
      border-radius: 99px;
      display: inline-block;
      margin-top: 6px;
    }
  </style>

  <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <script src="bg.js" defer></script>
  <script src="container.js"></script>
  <script src="button.js"></script>
  <script src="overrides.js"></script>
  <link rel="stylesheet" href="color-settings.css">
</head>

<body>

  <div id="loading">Đang tải...</div>

  <div id="header" class="glass" style="display:none">
    <span class="logo" id="btn-home-logo">🏠 GO TO HOME 😈</span>
    <div class="header-right">
      <span id="user-info"></span>
      <button id="btn-admin" class="btn-icon" title="Admin" style="display:none">⚙️</button>
      <button id="btn-undo" class="btn-icon" title="Hoàn tác (Ctrl+Z)" style="display:none">↩</button>
      <button id="btn-redo" class="btn-icon" title="Làm lại" style="display:none">↪</button>
      <button id="btn-reset-courses" class="btn-icon" title="Reset tất cả khóa học (Home)" style="display:none; color: var(--color-red);">🔄</button>
      <button id="btn-edit" class="btn-icon" title="Chỉnh sửa" style="display:none">✏️</button>
      <button class="btn btn-outline btn-sm" id="btn-signout">Đăng xuất</button>
    </div>
  </div>

  <div id="admin-panel" class="glass">
    <h4>⚙️ Admin Panel</h4>
    <p id="admin-last-updated">lastUpdated: —</p>
    <button class="btn btn-primary btn-sm" id="btn-trigger-sync">🔄 Sync ngay</button>
    <button class="btn btn-outline btn-sm" id="btn-check-video">🔍 Check Video</button>
    <button class="btn btn-outline btn-sm" id="btn-download-backup">⬇ Tải backup</button>
    <button class="btn btn-outline btn-sm" id="btn-upload-backup">⬆ Tải lên backup</button>
    <input type="file" id="backup-file-input" style="display:none" accept=".json">
    <div style="margin-top:12px; border-top:1px solid var(--color-border); padding-top:12px;">
      <div class="section-label">Cấu trúc khóa học</div>
      <button class="btn btn-outline btn-sm" id="btn-flatten-all">
        ⚡ Làm phẳng toàn bộ
      </button>
      <button class="btn btn-outline btn-sm" id="btn-unflatten"
        style="display:none">
        ↩ Hoàn tác làm phẳng
      </button>
    </div>
    <hr>
    <div class="section-label">Whitelist</div>
    <div class="admin-row">
      <input id="whitelist-input" type="email" placeholder="email@gmail.com">
      <button class="btn btn-primary btn-sm" id="btn-add-whitelist">Thêm</button>
    </div>
    <div id="whitelist-list"></div>
    <hr>
    <div class="section-label">Truy cập trái phép</div>
    <div id="security-logs"></div>
    <button class="btn-reload" id="btn-reload-admin">🔄 Tải lại</button>
  </div>

  <div id="page-landing" class="page">
    <div id="particles-js"></div>
    <div id="landing-content">
      <h1>HM-LEAKBASE 😈</h1>
      <p>Nền tảng học chui trực tuyến</p>
      <div id="landing-glass-btn">
        <button class="btn-glass-login" id="btn-signin-google">
          Đăng nhập bằng Google
        </button>
      </div>
    </div>
  </div>

  <div id="page-home" class="page">
    <h2>Khóa học của bạn</h2>
    <div class="course-grid" id="course-grid"></div>
  </div>

  <div id="page-course" class="page">
    <div class="sidebar glass" id="sidebar">
      <div class="sidebar-title" id="sidebar-title">—</div>
      <div id="sidebar-tree"></div>
    </div>
    <div class="course-main">
      <p>Chọn một bài học từ menu bên trái.</p>
    </div>
  </div>

  <div id="page-lesson" class="page">
    <div class="sidebar glass" id="sidebar-lesson">
      <div class="sidebar-title" id="sidebar-lesson-title">—</div>
      <div id="sidebar-lesson-tree"></div>
    </div>
    <div class="lesson-main">
      <h2 id="lesson-title">—</h2>
      <div class="video-wrap" id="video-wrap">
        <div class="no-video" id="no-video">Chưa có video</div>
      </div>
      <div class="watch-bar">
        <button class="btn-watch" id="btn-watch">Đánh dấu đã xem</button>
        <span id="watch-status"></span>
      </div>
      <div class="docs-section">
        <h3>Tài liệu</h3>
        <div class="doc-list" id="doc-list"></div>
      </div>
      <div id="lesson-edit-panel" style="display:none; flex-direction:column; gap:12px; margin-top:8px;"></div>
    </div>
  </div>

  <!-- Phase 2: Edit modal -->
  <div id="edit-overlay" style="display:none;position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.45)">
  </div>
  <div id="edit-modal" class="glass" style="display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
           z-index:1001;padding:24px;min-width:320px;max-width:440px;
           max-height:80vh;overflow-y:auto;">
  </div>

  <script src="app.js"></script>
  <script src="color-settings.js"></script>

</body>

</html>
