name: Crawl HMCalendar

on:
  schedule:
    # Full crawl: mỗi ngày lúc 3h sáng VN (20:00 UTC) — crawl đủ MONTHS_TO_CRAWL tháng
    - cron: "0 20 * * *"
    # Watch mode: mỗi 5 phút trong khung giờ live (~17h VN hôm trước → 2h VN hôm sau
    # = 10h-19h UTC cùng ngày) — chỉ crawl tháng hiện tại, phát hiện lùi lịch kịp thời.
    # Lưu ý: GitHub Actions không đảm bảo chạy đúng "mỗi 3 phút" như cron khai báo —
    # docs của GitHub khuyến cáo không nên trông cậy vào độ chính xác dưới 5 phút,
    # và lịch có thể bị trễ khi hệ thống đông tải. Đây là mức tần suất khả thi nhất
    # trên GitHub-hosted runner.
    - cron: "*/5 10-19 * * *"

  # Chạy tay từ GitHub UI
  workflow_dispatch:
    inputs:
      mode:
        description: "Chế độ: full | watch"
        required: false
        default: "full"
      months:
        description: "Số tháng crawl (chỉ dùng khi mode=full)"
        required: false
        default: "6"

jobs:
  crawl:
    name: Crawl & Push to Firestore
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repo
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Setup Python
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # 3. Cài dependencies Python
      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # 4. Cài Playwright và Chromium
      - name: Install Playwright & Chromium
        run: |
          pip install playwright
          playwright install chromium
          playwright install-deps chromium

      # 4b. Cài xvfb — màn hình giả để Chromium chạy headFUL thật trên server
      # không có màn hình. Lý do: hocmai có vẻ phát hiện Chromium chạy headless
      # (qua navigator.webdriver hoặc fingerprint khác) và đổi field thật/honeypot
      # — đã verify bằng test local: headless=False login được, headless=True thì không.
      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # 5. Chạy script crawl — qua xvfb-run, HEADLESS=false để Chromium chạy
      # headful thật (không phải headless giả lập) ngay trên server.
      - name: Run crawl_calendar.py
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python crawl_calendar.py
        env:
          # Tài khoản (ẩn trong secrets)
          HM_USERNAME:             ${{ secrets.HM_USERNAME }}
          HM_PASSWORD:             ${{ secrets.HM_PASSWORD }}
          # URL (ẩn trong secrets, không có trong mã nguồn)
          HM_BASE_URL:             ${{ secrets.HM_BASE_URL }}
          HM_CAL_PATH:             ${{ secrets.HM_CAL_PATH }}
          HM_LOGIN_PATH:           ${{ secrets.HM_LOGIN_PATH }}
          HM_LOGOUT_V2_PATH:       ${{ secrets.HM_LOGOUT_V2_PATH }}
          HM_LOGOUT_FINAL_PATH:    ${{ secrets.HM_LOGOUT_FINAL_PATH }}
          # Firebase
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          FIRESTORE_PROJECT_ID:    ${{ secrets.FIRESTORE_PROJECT_ID }}
          # Tham số chạy
          # Tự chọn watch mode khi đúng cron watch-mode kích hoạt; còn lại (full crawl
          # hằng ngày, hoặc chạy tay) mặc định full — input thủ công luôn được ưu tiên.
          CRAWL_MODE:              ${{ github.event.inputs.mode || (github.event.schedule == '*/5 10-19 * * *' && 'watch') || 'full' }}
          MONTHS_TO_CRAWL:         ${{ github.event.inputs.months || '6' }}
          HEADLESS:                "false"

      # 6. Lưu screenshot/HTML debug khi do_login() fail — xem được trang login
      #    thật trông thế nào lúc lỗi, không phải đoán mù qua traceback.
      - name: Upload login debug artifact (nếu fail)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: login-debug
          path: |
            login_failure.png
            login_failure.html
          retention-days: 5
          if-no-files-found: ignore