name = "brightweb-sync"
main = "worker.js"
compatibility_date = "2024-09-01"

# Cron triggers:
# - reminderJob mỗi phút (T-90s push reminder) — đã có từ trước
# - watchModeJob mỗi 3 phút, 07:00-23:55 VN (00:00-16:55 UTC) — lấy m3u8 khi live
[triggers]
crons = [
  "* * * * *",        # reminderJob
  "*/3 0-16 * * *",   # watchModeJob — 07:00-23:55 VN
]